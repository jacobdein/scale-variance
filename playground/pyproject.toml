[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalevar-playground"
version = "0.1.0"
description = "Interactive playground for the scalevar Moellering-Tobler decomposition"
readme = "README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jake Dein", email = "jake@jacobdein.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Private :: Do Not Upload",
]
dependencies = [
    "scalevar",
    "marimo>=0.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]
