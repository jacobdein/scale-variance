name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_run:
    # On tag pushes, release.yml uploads the GitHub-Release wheel the
    # playground installs at runtime via micropip. Re-trigger docs after
    # release.yml succeeds so the deployed playground always points at a
    # wheel that exists. (Tag pushes also trigger this workflow directly,
    # but that race finishes before the wheel is uploaded.)
    workflows: [release]
    types: [completed]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # If triggered by workflow_run, only proceed when release.yml succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scalevar (with docs / raster / spatial extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python[raster,spatial,docs]"

      - name: Install playground tooling
        run: |
          pip install build ghp-import marimo
          pip install -e ./playground --no-deps

      - name: Build mkdocs site
        run: |
          cd python
          mkdocs build --strict

      - name: Export marimo notebook to WASM bundle
        run: |
          cd playground
          bash scripts/export_wasm.sh

      - name: Merge playground bundle into the mkdocs site
        run: |
          mkdir -p python/site/playground
          cp -r playground/dist/. python/site/playground/

      - name: Deploy via ghp-import
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_run'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-history --force --push --message "deploy ${GITHUB_SHA::7}" python/site
