site_name: scalevar (Python)
site_description: Moellering-Tobler scale-variance decomposition for rasters and nested hierarchies.
site_url: https://jacobdein.github.io/scale-variance/
repo_url: https://github.com/jacobdein/scale-variance
repo_name: jacobdein/scale-variance
edit_uri: edit/main/python/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
      remove_tag_config:
        remove_input_tags:
          - hide_input
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: numpy
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Playground: playground.md
  - Examples:
      - Overview: examples/index.md
      - "1. Tabular admin hierarchy": examples/01_tabular_admin.ipynb
      - "2. Moellering & Tobler (1972) Figure 3": examples/02_raster_mt1972_fig3.ipynb
      - "3. Polygon hierarchy": examples/03_polygon_hierarchy.ipynb
  - API reference: api.md
  - Theory: theory.md
  - Changelog: changelog.md
