[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalevar"
version = "0.1.0.dev0"
description = "Moellering-Tobler scale-variance decomposition for rasters and nested hierarchies"
readme = "README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jake Dein", email = "jake@jacobdein.com" },
]
keywords = ["geography", "variance", "scale", "anova", "raster", "spatial"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
raster = [
    "xarray>=2023.1",
    "rioxarray>=0.15",
    "rasterio>=1.3",
]
spatial = [
    "geopandas>=0.14",
    "shapely>=2.0",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/jacobdein/scale-variance"
Repository = "https://github.com/jacobdein/scale-variance"
Issues = "https://github.com/jacobdein/scale-variance/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scalevar"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003: allow unicode × and em-dashes in math-heavy docstrings/comments.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rasterio.*", "rioxarray.*", "geopandas.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
